  const local=!NUBE.on;
  const T={
    entrar:['Iniciar sesión','Entre como profesor para ver su planeación.',`${tarjetasRecordadas()}${campo('aId','Usuario o correo','text','username','Ej.: Julian Pinto o julian@gmail.com')}${campoClave('aPass','Contraseña','current-password')}<label class="chk recordar"><input type="checkbox" id="aRecordar" checked><span>Recordar usuario y contraseña en este equipo</span></label><button type="button" class="link" data-auth="recuperar">¿Olvidó su contraseña?</button><button type="button" data-submit class="btn pri ancho">Entrar</button><p class="auth-alt">¿No tiene cuenta? <button type="button" class="link" data-auth="registro">Crear una cuenta</button></p>`],
    registro:['Crear cuenta de profesor','Complete los tres datos para empezar.',`${campo('aEmail','Correo','email','email','nombre@gmail.com')}${campo('aUser','Usuario','text','username','Ej.: Julian Pinto')}${campoClave('aPass','Contraseña','new-password',true)}<button type="button" data-submit class="btn pri ancho">Crear cuenta</button><p class="auth-alt">¿Ya tiene cuenta? <button type="button" class="link" data-auth="entrar">Iniciar sesión</button></p>`],
    recuperar:local?['Recuperar contraseña','Las cuentas de este equipo no tienen recuperación por correo.',`<div class="auth-aviso">La cuenta está guardada solo en este navegador. Si olvidó la contraseña, revise si quedó guardada arriba en "Cuentas guardadas en este equipo", o cree una cuenta nueva.</div><button type="button" class="btn ancho" data-auth="entrar">Volver a iniciar sesión</button>`]
      :['Recuperar contraseña','Le enviaremos un correo con un enlace para crear una nueva.',`${campo('aEmail','Correo de su cuenta','email','email','nombre@gmail.com')}<button type="button" data-submit class="btn pri ancho">Enviar enlace</button><p class="auth-alt"><button type="button" class="link" data-auth="entrar">Volver a iniciar sesión</button></p>`],
    nueva:['Nueva contraseña','Escriba la contraseña que usará desde ahora.',`${campoClave('aPass','Nueva contraseña','new-password',true)}<button type="button" data-submit class="btn pri ancho">Guardar contraseña</button>`],
    confirmar:['Revise su correo',`Le enviamos un enlace a <b>${esc(extra.email||'su correo')}</b>. Ábralo para activar la cuenta y entrar. Si no lo ve, busque en la carpeta de spam.`,`<button type="button" class="btn ancho" data-auth="entrar">Ya la activé, iniciar sesión</button>`],
    migrar:['Encontramos datos en este equipo','Hay una planeación guardada en este navegador. ¿Quiere pasarla a su cuenta?',`<button type="button" class="btn pri ancho" data-auth="migrarSi">Sí, pasarla a mi cuenta</button><button type="button" class="btn ancho" data-auth="migrarNo">No, empezar desde cero</button>`]
  }[modo];
  a.innerHTML=`<aside class="auth-izq"><div class="brand"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--pencil);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">${IC.pencil}</svg><div><b>${marca()}</b><small>Para docentes de escuela rural</small></div></div>
    <div class="auth-msg"><h1>Planee sus clases multigrado y prepare guías en minutos.</h1>
    <ul class="auth-lista"><li>${ic('cal')}<span>Cada tema dividido en clases con fecha</span></li><li>${ic('book')}<span>Guías para resolver, listas en PDF y Word</span></li><li>${ic('ruler')}<span>Avance y temas atrasados de cada grado</span></li></ul></div>
    <small class="auth-pie">© ${new Date().getFullYear()} ${esc(NOMBRE_APP)}</small></aside>
  <main class="auth-der"><form class="auth-card" id="authForm" novalidate><h2>${T[0]}</h2><p class="auth-sub">${T[1]}</p>${aviso?`<div class="auth-aviso" role="status">${esc(aviso)}</div>`:''}<div class="auth-err" role="alert" hidden></div>${T[2]}
    ${local&&/entrar|registro/.test(modo)?'<p class="auth-nota">Las cuentas y la planeación se guardan en este equipo.</p>':''}</form></main>`;
  const f=$('#authForm'),err=m=>{const e=f.querySelector('.auth-err');e.textContent=m;e.hidden=!m},val=id=>($('#'+id)?.value||'').trim();
  const ocupado=on=>f.querySelectorAll('button,input').forEach(b=>b.disabled=on);
  const REV={aId:revisarId,aEmail:revisarCorreo,aUser:revisarUsuario};
  const tocado=new Set();
  f.addEventListener('input',e=>{const id=e.target.id;if(REV[id]&&tocado.has(id))mostrarMsg(id,REV[id](e.target.value));if(id==='aPass'){if($('#f_aPass'))pintarFuerza('aPass');else mostrarMsg('aPass',null)}err('')});
  f.addEventListener('focusout',e=>{const id=e.target.id;if(REV[id]&&e.target.value){tocado.add(id);mostrarMsg(id,REV[id](e.target.value))}});
  f.addEventListener('keyup',e=>{if(e.target.type==='password'||e.target.id==='aPass'){const caps=e.getModifierState?.('CapsLock');const m=$('#m_aPass');if(!m)return;if(caps&&!m.dataset.caps){m.dataset.caps=1;if(!$('#f_aPass'))mostrarMsg('aPass',{warn:'Tiene activadas las mayúsculas (Bloq Mayús).'})}else if(!caps&&m.dataset.caps){delete m.dataset.caps;if(!$('#f_aPass'))mostrarMsg('aPass',null)}}});
  // Tocar «Usar…» o «Ver» no le quita el foco al campo, así el mensaje no se redibuja y el toque no se pierde
  f.addEventListener('mousedown',e=>{if(e.target.closest('[data-sug],[data-ver]'))e.preventDefault()});
  f.onclick=e=>{const v=e.target.closest('[data-ver]');if(v){const i=$('#'+v.dataset.ver);i.type=i.type==='password'?'text':'password';v.textContent=i.type==='password'?'Ver':'Ocultar';return}
    const sg=e.target.closest('[data-sug]');if(sg){const i=$('#'+sg.dataset.para);i.value=sg.dataset.sug;mostrarMsg(sg.dataset.para,REV[sg.dataset.para](i.value));i.focus();return}
    const us=e.target.closest('[data-usar]');if(us){const r=recordadas().find(x=>x.usuario===us.dataset.usar);$('#aId').value=r.usuario;$('#aPass').value=r.clave||'';mostrarMsg('aId',null);(r.clave?f.querySelector('[data-submit]'):$('#aPass')).focus();return}
    const ol=e.target.closest('[data-olvidar]');if(ol){olvidar(NUBE.on?'nube':'local',ol.dataset.olvidar);pantallaAuth('entrar','Se quitó la cuenta de este equipo. La cuenta y su planeación siguen existiendo.');return}
    const b=e.target.closest('[data-auth]');if(!b)return;const m=b.dataset.auth;
    if(m==='migrarSi'){S=extra.local;if(extra.nombre)S.config.docente=extra.nombre;save();arrancar();toast('Su planeación quedó guardada en su cuenta');return}
    if(m==='migrarNo'){S=datosNuevos(extra.nombre);save();arrancar();return}
    pantallaAuth(m)};
  f._go=async()=>{err('');
    const revisar=ids=>{let bien=true,primero=null;for(const id of ids){const r=id==='aPass'?revisarClave($('#aPass').value,modo!=='entrar'):REV[id](val(id));tocado.add(id);
      if(id==='aPass'&&$('#f_aPass')){pintarFuerza('aPass');if(r.err){const m=$('#m_aPass');m.className='fmsg err';m.textContent=r.err}}else mostrarMsg(id,r.err||r.warn?r:null);
      if(r.err||(r.warn&&modo==='registro'&&id==='aEmail')){bien=false;primero??=id}}if(primero)$('#'+primero).focus();return bien};
    try{
      if(modo==='entrar'){if(!revisar(['aId','aPass']))return;const idTxt=revisarId(val('aId')).val,clave=$('#aPass').value;ocupado(true);
        const r=await accionEntrar(idTxt,clave);if($('#aRecordar')?.checked)recordar({modo:NUBE.on?'nube':'local',usuario:r.usuario,correo:r.correo,clave});return r.ir()}
      if(modo==='registro'){if(!revisar(['aEmail','aUser','aPass']))return;ocupado(true);
        const correo=revisarCorreo(val('aEmail')).val,ru=revisarUsuario(val('aUser')),usuario=ru.val,llave=ru.key,clave=$('#aPass').value;
        const r=await accionRegistrar({correo,usuario,llave,clave});recordar({modo:NUBE.on?'nube':'local',usuario,correo,clave});
        if(r.confirmar)return pantallaAuth('confirmar','',{email:correo});return r.ir()}
      if(modo==='recuperar'){if(!revisar(['aEmail']))return;ocupado(true);await sb('/auth/v1/recover',{method:'POST',body:{email:revisarCorreo(val('aEmail')).val}});
        return pantallaAuth('entrar','Si ese correo tiene cuenta, le llegará un enlace para crear una nueva contraseña. Revise también la carpeta de spam.')}
      if(modo==='nueva'){if(!revisar(['aPass']))return;ocupado(true);const clave=$('#aPass').value;
        await sb('/auth/v1/user',{method:'PUT',token:NUBE.recup.access_token,body:{password:clave}});guardarSesion(NUBE.recup);NUBE.recup=null;actualizarRecordada(cuentaActual().usuario,clave);toast('Contraseña actualizada');return entrarConDatos()}
    }catch(e){ocupado(false);err(errAuth(e));if(e?.code==='usuario_existe')mostrarMsg('aUser',{err:ERR_AUTH.usuario_existe})}};
  setTimeout(()=>f.querySelector('input:not([type=checkbox])')?.focus(),50)}
function modalCambiarClave(){
  openModal('Cambiar contraseña',`<form id="ccForm" class="grid2" novalidate>${campoClave('ccActual','Contraseña actual','current-password').replace('class="fld"','class="fld wide"')}${campoClave('aPass','Nueva contraseña','new-password',true).replace('class="fld"','class="fld wide"')}<div class="auth-err wide" role="alert" hidden></div><div class="mact wide"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" data-submit class="btn pri">${ic('check')} Guardar</button></div></form>`,()=>{
    const f=$('#ccForm'),err=m=>{const e=f.querySelector('.auth-err');e.textContent=m;e.hidden=!m};
    f.addEventListener('input',e=>{if(e.target.id==='aPass')pintarFuerza('aPass');err('')});
    f.onclick=e=>{const v=e.target.closest('[data-ver]');if(v){const i=$('#'+v.dataset.ver);i.type=i.type==='password'?'text':'password';v.textContent=i.type==='password'?'Ver':'Ocultar'}};
    f._go=async()=>{const actual=$('#ccActual').value,nueva=$('#aPass').value;if(!actual)return err('Escriba su contraseña actual.');const r=revisarClave(nueva,true);if(r.err)return err(r.err);if(nueva===actual)return err(ERR_AUTH.same_password);
      f.querySelectorAll('button,input').forEach(b=>b.disabled=true);
      try{await accionCambiarClave(actual,nueva);closeModal();toast('Contraseña actualizada')}catch(e){f.querySelectorAll('button,input').forEach(b=>b.disabled=false);err(errAuth(e))}}})}
async function usoIA(){if(!NUBE.on)return null;try{const tk=await tokenNube();const r=await fetch('/api/guia',{headers:{Authorization:'Bearer '+tk}});if(!r.ok)return null;NUBE.uso=await r.json();return NUBE.uso}catch(e){return null}}
async function iniciar(){
  const cfg=await cargarConfig();
  if(cfg?.nombre){NOMBRE_APP=cfg.nombre;document.title=cfg.nombre}
  if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){LOC.on=true;const id=lsGet('md_sesion_local');if(id&&cuentasLocales()[id])return entrarLocal(id);return pantallaAuth('entrar')}
  NUBE.cfg=cfg;NUBE.on=true;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('error_description')||h.get('error')){history.replaceState(null,'',location.pathname+location.search);return pantallaAuth('entrar','El enlace del correo ya no es válido o ya se usó. Pida uno nuevo.')}
  if(h.get('access_token')){history.replaceState(null,'',location.pathname+location.search);
    const d={access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:+h.get('expires_in')||3600};
    try{d.user=await sb('/auth/v1/user',{token:d.access_token})}catch(e){return pantallaAuth('entrar','El enlace del correo ya no es válido o ya se usó. Pida uno nuevo.')}
    if(h.get('type')==='recovery'){NUBE.recup=d;return pantallaAuth('nueva')}
    guardarSesion(d);toast('¡Cuenta activada!');return entrarConDatos()}
  let ses=null;try{ses=JSON.parse(lsGet('pd_sesion')||'null')}catch(e){}
  if(ses?.refresh_token){NUBE.ses=ses;return entrarConDatos()}
  pantallaAuth('entrar')}

window.addEventListener('hashchange',()=>{if(NUBE.on&&/access_token=|error_description=/.test(location.hash))iniciar()});
iniciar();
</script>
